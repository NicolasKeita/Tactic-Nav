plugins {
    id 'com.android.test'
}

android {
    namespace = 'com.example.benchmark'
    compileSdk = 36

    defaultConfig {
        minSdk = 33
        targetSdk = 36

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // ✅ Autorise le benchmark à s'exécuter sur l'émulateur de test
        testInstrumentationRunnerArguments["androidx.benchmark.suppressErrors"] = "EMULATOR,DEBUGGABLE,GRANT"
    }

    buildTypes {
        // This benchmark buildType is used for benchmarking, and should function like your
        // release build (for example, with minification on). It's signed with a debug key
        // for easy local/CI testing.
        benchmark1 {
            debuggable = true
            signingConfig = debug.signingConfig
            matchingFallbacks = ["release"]
        }
    }

    targetProjectPath = ":app"
    experimentalProperties["android.experimental.self-instrumenting"] = true

    testOptions {
        managedDevices {
            localDevices.create("pixel6api34") {
                device = "Pixel 6"
                apiLevel = 34
                systemImageSource = "aosp_atd"
                require64Bit = true
                testedAbi = "x86_64"
            }
        }
    }
}

dependencies {
    implementation 'androidx.benchmark:benchmark-macro-junit4:1.3.0'
    implementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'androidx.test.ext:junit:1.1.5'
    implementation 'androidx.test.uiautomator:uiautomator:2.2.0'
}

androidComponents {
    beforeVariants(selector().all()) {
        enable = buildType == "benchmark1"
    }
}