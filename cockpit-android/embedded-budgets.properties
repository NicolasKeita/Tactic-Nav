# Build-time embedded budget gates for the Android cockpit.
# Runtime budgets are consumed by instrumented tests; build artifact budgets are
# consumed by the Gradle checkEmbeddedBudgets task.

heap.maxMb=45
heap.postWarmupGrowthMb=1
frame.minFps=30

# Current debug APK baseline is about 2.5 MB. The 4 MB gate leaves margin while
# still catching accidental dependency/resource growth.
apk.debug.maxMb=4

instrumentation.warmupMs=30000
instrumentation.durationMs=180000
