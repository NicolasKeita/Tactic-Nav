def embeddedBudgetFile = rootProject.layout.projectDirectory.file("embedded-budgets.properties")
def embeddedBudgetReportDir = layout.buildDirectory.dir("reports/embedded-budgets")
def embeddedBudgetReportFile = embeddedBudgetReportDir.map { it.file("embedded-budgets.json") }
def cockpitRuntimeBudgetReportFile = embeddedBudgetReportDir.map { it.file("cockpit-runtime-budget-report.json") }

long megabytesToBytes(String value) {
    return new BigDecimal(value).multiply(new BigDecimal(1024 * 1024)).longValue()
}

String formatMegabytes(long bytes) {
    return String.format(java.util.Locale.US, "%.2f MB", bytes / (1024.0d * 1024.0d))
}

String formatNumber(double value) {
    return String.format(java.util.Locale.US, "%.2f", value)
}

String passFail(boolean passed) {
    return passed ? "PASS" : "FAIL"
}

def loadEmbeddedBudgetProperties = {
    def file = embeddedBudgetFile.asFile
    if (!file.exists()) {
        throw new GradleException("Missing embedded budget file: ${file}")
    }
    def properties = new java.util.Properties()
    file.withInputStream { properties.load(it) }
    return properties
}

def embeddedBudgets = loadEmbeddedBudgetProperties()

def runAdb = { List<String> args, int timeoutSeconds ->
    def command = [android.adbExecutable.absolutePath] + args
    def process = new ProcessBuilder(command).start()
    def stdout = new ByteArrayOutputStream()
    def stderr = new ByteArrayOutputStream()
    def stdoutThread = Thread.start { process.inputStream.transferTo(stdout) }
    def stderrThread = Thread.start { process.errorStream.transferTo(stderr) }

    if (!process.waitFor(timeoutSeconds, java.util.concurrent.TimeUnit.SECONDS)) {
        process.destroyForcibly()
        stdoutThread.join(1000L)
        stderrThread.join(1000L)
        throw new GradleException("Timed out after ${timeoutSeconds}s while running adb ${args.join(" ")}")
    }

    stdoutThread.join(1000L)
    stderrThread.join(1000L)
    return [
            exitValue: process.exitValue(),
            stdout   : stdout.toString("UTF-8"),
            stderr   : stderr.toString("UTF-8")
    ]
}

def connectedAndroidDevices = {
    def result = runAdb(["devices"], 15)
    if (result.exitValue != 0) {
        throw new GradleException("Unable to list Android devices with adb: ${result.stderr}")
    }
    return result.stdout
            .readLines()
            .findAll { it.endsWith("\tdevice") }
            .collect { it.split("\\s+")[0] }
}

