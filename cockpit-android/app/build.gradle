tasks.register("checkEmbeddedBudgets") {
    group = "verification"
    description = "Checks cockpit Android embedded build artifact budgets."
    dependsOn("assembleDebug")

    inputs.file(embeddedBudgetFile)
    inputs.file(layout.buildDirectory.file("outputs/apk/debug/app-debug.apk"))
    outputs.file(embeddedBudgetReportFile)

    doLast {
        def budgets = loadEmbeddedBudgetProperties()
        def apk = layout.buildDirectory.file("outputs/apk/debug/app-debug.apk").get().asFile
        if (!apk.exists()) {
            throw new GradleException("Missing debug APK: ${apk}")
        }

        long apkMaxBytes = megabytesToBytes(budgets.getProperty("apk.debug.maxMb"))
        long apkBytes = apk.length()
        if (apkBytes > apkMaxBytes) {
            throw new GradleException("Debug APK is ${apkBytes} bytes, over budget ${apkMaxBytes} bytes")
        }

        long dexBytes = 0L
        long resourceBytes = 0L
        def zip = new java.util.zip.ZipFile(apk)
        try {
            zip.entries().each { entry ->
                if (entry.name.endsWith(".dex")) {
                    dexBytes += entry.size
                }
                if (entry.name.startsWith("res/") || entry.name == "resources.arsc") {
                    resourceBytes += entry.size
                }
            }
        } finally {
            zip.close()
        }

        def reportDir = embeddedBudgetReportDir.get().asFile
        reportDir.mkdirs()
        def report = embeddedBudgetReportFile.get().asFile
        report.text = """{
  "apkDebugBytes": ${apkBytes},
  "apkDebugBudgetBytes": ${apkMaxBytes},
  "dexBytes": ${dexBytes},
  "resourceBytes": ${resourceBytes},
  "heapMaxMb": ${budgets.getProperty("heap.maxMb")},
  "frameMinFps": ${budgets.getProperty("frame.minFps")}
}
"""
        logger.lifecycle("Embedded budget report written to ${report}")
    }
}

tasks.register("printEmbeddedBudgetSummary") {
    group = "verification"
    description = "Prints the default cockpit embedded budget summary."
    dependsOn("checkHotPathAllocations")
    dependsOn("checkEmbeddedBudgets")

    inputs.file(embeddedBudgetReportFile)

    doLast {
        def report = embeddedBudgetReportFile.get().asFile
        def data = new groovy.json.JsonSlurper().parse(report)
        boolean apkPass = ((Number) data.apkDebugBytes).longValue() <= ((Number) data.apkDebugBudgetBytes).longValue()

        logger.lifecycle("")
        logger.lifecycle("Cockpit embedded build budgets:")
        logger.lifecycle("  APK debug: ${formatMegabytes(((Number) data.apkDebugBytes).longValue())} / ${formatMegabytes(((Number) data.apkDebugBudgetBytes).longValue())} ${passFail(apkPass)}")
        logger.lifecycle("  DEX: ${formatMegabytes(((Number) data.dexBytes).longValue())}")
        logger.lifecycle("  Hot-path allocations: PASS")
        logger.lifecycle("  Runtime heap/FPS: NOT RUN in default verify")
        logger.lifecycle("  Run ./gradlew pixel6api34DebugAndroidTest to execute instrumented tests on the managed virtual device.")
        logger.lifecycle("")
    }
}

tasks.register("checkHotPathAllocations") {
    group = "verification"
    description = "Checks known allocation-heavy APIs in cockpit rendering hot paths."

    def hotPathFiles = files(
            "src/main/java/com/tacticnav/cockpit/ui/TacticalDisplayView.java",
            "src/main/java/com/tacticnav/cockpit/render/CanvasTacticalMapEngine.java"
    )
    inputs.files(hotPathFiles)

    doLast {
        def violations = []
        hotPathFiles.files.each { sourceFile ->
            sourceFile.eachLine { line, number ->
                if (line.contains("String.format(")) {
                    violations.add("${sourceFile.name}:${number}: avoid String.format in cockpit render hot paths")
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("Hot-path allocation check failed:\n" + violations.join("\n"))
        }
    }
}


tasks.register("pullCockpitRuntimeBudgetReport") {
    group = "verification"
    description = "Pulls the cockpit runtime budget report from the connected debug app."
    dependsOn("connectedDebugAndroidTest")

    outputs.file(cockpitRuntimeBudgetReportFile)

    doLast {
        def report = cockpitRuntimeBudgetReportFile.get().asFile
        report.parentFile.mkdirs()

        def result = runAdb(["shell", "run-as", android.defaultConfig.applicationId, "cat", "files/cockpit-runtime-budget-report.json"], 15)
        if (result.exitValue != 0) {
            throw new GradleException("Unable to pull cockpit runtime budget report with adb run-as: ${result.stderr}")
        }

        report.text = result.stdout
        logger.lifecycle("Cockpit runtime budget report written to ${report}")
    }
}

tasks.register("printCockpitRuntimeBudgetSummary") {
    group = "verification"
    description = "Prints measured cockpit runtime heap and frame budget results."
    dependsOn("pullCockpitRuntimeBudgetReport")

    inputs.file(cockpitRuntimeBudgetReportFile)
    inputs.file(embeddedBudgetFile)

    doLast {
        def budgets = loadEmbeddedBudgetProperties()
        def report = cockpitRuntimeBudgetReportFile.get().asFile
        def data = new groovy.json.JsonSlurper().parse(report)

        long heapMaxBytes = megabytesToBytes(budgets.getProperty("heap.maxMb"))
        long heapGrowthMaxBytes = megabytesToBytes(budgets.getProperty("heap.postWarmupGrowthMb"))
        double frameMinFps = Double.parseDouble(budgets.getProperty("frame.minFps"))
        long peakHeapBytes = ((Number) data.peakJavaHeapBytes).longValue()
        long heapGrowthBytes = ((Number) data.heapGrowthAfterWarmupBytes).longValue()
        double averageFps = ((Number) data.averageFps).doubleValue()

        logger.lifecycle("")
        logger.lifecycle("Cockpit runtime embedded budgets:")
        logger.lifecycle("  Peak Java heap: ${formatMegabytes(peakHeapBytes)} / ${formatMegabytes(heapMaxBytes)} ${passFail(peakHeapBytes <= heapMaxBytes)}")
        logger.lifecycle("  Post-warm-up heap growth: ${formatMegabytes(heapGrowthBytes)} / ${formatMegabytes(heapGrowthMaxBytes)} ${passFail(heapGrowthBytes <= heapGrowthMaxBytes)}")
        logger.lifecycle("  Average FPS: ${formatNumber(averageFps)} / ${formatNumber(frameMinFps)} ${passFail(averageFps >= frameMinFps)}")
        logger.lifecycle("  Slow frames: ${((Number) data.slowFrames).longValue()}")
        logger.lifecycle("  Report: ${report}")
        logger.lifecycle("")
    }
}

tasks.register("verifyCockpitRuntimeBudgets") {
    group = "verification"
    description = "Runs connected runtime budget checks and prints measured heap/frame results."
    dependsOn("printCockpitRuntimeBudgetSummary")
}

