plugins {
    id "com.android.application"
}

android {
    namespace = "com.tacticnav.cockpit"
    compileSdk = 33

    defaultConfig {
        applicationId = "com.tacticnav.cockpit"
        minSdk = 33
        targetSdk = 33
        versionCode = 1
        versionName = "0.1.0"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}

tasks.register("copyDebugApk", Copy) {
    from(layout.buildDirectory.dir("outputs/apk/debug"))
    include("*.apk")
    rename(".*\\.apk", "Tactic-Nav-Cockpit-Android.apk")

    into(rootProject.layout.projectDirectory.dir("../bin"))
}

afterEvaluate {
    tasks.named("assembleDebug") {
        finalizedBy(tasks.named("copyDebugApk"))
    }
}