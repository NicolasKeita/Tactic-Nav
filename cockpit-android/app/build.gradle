plugins {
    id "com.android.application"
}

android {
    namespace "com.tacticnav.cockpit"
    compileSdk 36

    defaultConfig {
        applicationId "com.tacticnav.cockpit"
        minSdk 33
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
