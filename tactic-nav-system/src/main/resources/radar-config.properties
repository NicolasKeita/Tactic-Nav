##############################################################################
# Radar Simulator Configuration (used by RadarSimulator and RadarOptions)
##############################################################################
radar.default.host=127.0.0.1
radar.default.port=5001
radar.default.id=1

##############################################################################
# ATC Server Configuration
##############################################################################

# Radar input sources (UDP ports)
# Multiple radars can be ingested in parallel
# Format: comma-separated list of UDP ports
atc.radar.ports=15001,15002,15003

# Reference position for radar coordinate transformation
# Used as the origin point for spherical-to-Cartesian conversion
atc.radar.lat=40.7128
atc.radar.lon=-74.0060
atc.radar.alt=100.0

# Broadcast configuration
# Sends consolidated situation state to cockpit clients
atc.broadcast.port=15000
atc.broadcast.interval=100

# Cockpit client addresses (semicolon-separated, format: ip:port)
# Multiple clients can receive broadcasts simultaneously
atc.cockpit.addresses=127.0.0.1:16000;127.0.0.1:16001