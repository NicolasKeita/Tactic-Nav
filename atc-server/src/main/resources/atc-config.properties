##############################################################################
# ATC Server Configuration
##############################################################################

# ATC UDP input socket.
# The ATC owns this local address and port. Radar senders use any source port
# they want and send datagrams to this endpoint.
# Use 0.0.0.0 to listen on every local interface, or set the PC LAN IP to
# restrict ingestion to one network interface.
atc.bind.address=0.0.0.0
atc.listen.port=15001
