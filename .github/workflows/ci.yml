name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x ./mvnw

      - name: Build and test with Maven
        run: ./mvnw verify --batch-mode --no-transfer-progress

      - name: Static code analysis (SpotBugs & Custom rules)
        continue-on-error: true
        run: ./mvnw verify -Pstatic-analysis --batch-mode --no-transfer-progress

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: '**/target/site/spotbugs/'

      - name: Upload cockpit embedded budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-embedded-budget-report
          path: cockpit-android/app/build/reports/embedded-budgets/
